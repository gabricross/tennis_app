<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tennis Lab · Dos ejemplos de análisis</title>
  <link rel="stylesheet" href="assets/video-loader.css">
  <script src="assets/video-loader.js" defer></script>
  <script src="assets/examples.js" defer></script>
  <style>
    :root{color-scheme:dark}
    body{margin:0;background:#0c171b;color:#ecf3ec;font-family:"Segoe UI",Arial,sans-serif;line-height:1.6}
    main{max-width:960px;margin:0 auto;padding:40px 20px}
    .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#a2b7ba;margin:0 0 8px}
    h1{font-size:32px;margin:0 0 12px}
    .lead{color:#a2b7ba;max-width:70ch}
    .showcase-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:24px 0}
    figure{margin:0}
    figcaption{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#a2b7ba;margin-bottom:6px}
    video{width:100%;border-radius:10px;background:#000}
    .media-example{background:#14252b;border:1px solid #2a4147;border-radius:12px;padding:18px 20px}
    ul{margin:8px 0 0;padding-left:20px;color:#a2b7ba}
    a{color:#d9fa73}
    @media (max-width:720px){.showcase-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Tennis Lab · Demo no comercial</p>
    <h1>Tenis real, dos perspectivas.</h1>
    <p class="lead">Compara el original y su análisis. Esta web no admite subidas: para analizar tus vídeos, <a href="https://github.com/gabricross/tennis_app#readme">instala Tennis Lab en tu equipo</a>.</p>

    <p class="lead">Cada ejemplo tiene sus propios controles. Espera a la carga completa y pulsa «Reproducir ambos».</p>
    <div id="examples" data-example-manifest="examples.json"></div>
    <noscript><p>Activa JavaScript o abre los vídeos: CalTennis (<a href="media/caltennis_original_20s.mp4">original</a> / <a href="media/caltennis_analisis_20s.mp4">análisis</a>) y toma aérea (<a href="media/pexels_20219055_original.mp4">original</a> / <a href="media/pexels_20219055_analisis.mp4">análisis</a>). Créditos y condiciones en <a href="examples.json">el registro de ejemplos</a>.</p></noscript>
  </main>
</body>
</html>
